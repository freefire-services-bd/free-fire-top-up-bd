<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREE FIRE TOP UP BD</title>
<style>
  :root { --bg:#090b10; --panel:#141923; --red:#ff3b3b; --gold:#ffbd45; --muted:#aab3c2; --line:#293140; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui, sans-serif; }
  body { background:#090b10; color:#f7f8fb; padding-bottom:50px; }
  header { padding:18px; text-align:center; border-bottom:1px solid var(--line); position:relative; }
  .adm-btn { position:absolute; top:14px; right:14px; background:#1d2534; color:var(--gold); border:1px solid #3a465e; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:bold; cursor:pointer; }
  .logo { font-weight:900; font-size:28px; }
  .logo span { color:var(--gold); }
  .wrap { max-width:850px; margin:auto; padding:16px; }
  .notice { background:#241719; border:1px solid #693035; border-radius:10px; padding:11px; color:#ffd5d5; font-size:13px; margin-bottom:16px; }
  h2 { font-size:17px; margin:18px 0 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:9px; }
  .pkg { background:#161c28; border:1px solid var(--line); border-radius:11px; padding:13px; text-align:left; color:#fff; cursor:pointer; }
  .pkg.selected { border-color:var(--red); box-shadow:0 0 0 1px var(--red); }
  .price { color:var(--gold); font-weight:bold; margin-top:5px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:18px; }
  label { display:block; font-size:13px; color:#dce2ec; margin:11px 0 5px; }
  input, select { width:100%; padding:11px; border-radius:9px; border:1px solid #364052; background:#0c1119; color:#fff; font-size:14px; }
  .btn { width:100%; border:0; border-radius:10px; padding:13px; background:linear-gradient(90deg,#ff3434,#ff6b37); color:#fff; font-size:15px; font-weight:bold; margin-top:14px; cursor:pointer; }
  .summary { display:none; margin-top:14px; padding:12px; border-radius:10px; background:#10251c; border:1px solid #286344; font-size:13px; line-height:1.6; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; text-align:center; }
  .stat b { color:var(--gold); font-size:18px; display:block; }
  .ocard { background:#0e131c; border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:9px; font-size:13px; line-height:1.6; }
  .pkg-row { display:flex; justify-content:space-between; align-items:center; gap:8px; background:#0e131c; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13px; }
  .sbtn { padding:6px 10px; border-radius:6px; border:0; font-size:12px; font-weight:bold; cursor:pointer; margin-right:6px; margin-top:6px; }
</style>
</head>
<body>

<header>
  <button class="adm-btn" id="toggleAdmin" type="button">⚙️ Admin</button>
  <div class="logo">FREE FIRE <span>TOP UP BD</span></div>
</header>

<main class="wrap">
  <!-- STORE VIEW -->
  <div id="storeView">
    <div class="notice" id="noticeText">🔥 প্যাকেজ সিলেক্ট করে Player ID ও TrxID দিয়ে অর্ডার দিন।</div>
    <h2>💎 Diamond & Membership Package</h2>
    <div class="grid" id="pkgGrid"></div>

    <div class="box">
      <h2 style="margin-top:0">অর্ডার ফর্ম</h2>
      <label for="playerId">Player ID</label>
      <input id="playerId" inputmode="numeric" placeholder="আপনার Player ID">
      <label for="selectedPkg">নির্বাচিত প্যাকেজ</label>
      <input id="selectedPkg" readonly placeholder="উপর থেকে সিলেক্ট করুন">
      <label for="payMethod">পেমেন্ট পদ্ধতি (bKash / Nagad: <span id="payNumShow" style="color:#ffbd45">01700-000000</span>)</label>
      <select id="payMethod">
        <option value="bKash">bKash</option>
        <option value="Nagad">Nagad</option>
      </select>
      <label for="senderNum">সেন্ডার নম্বর</label>
      <input id="senderNum" inputmode="tel" placeholder="01XXXXXXXXX">
      <label for="trxId">Transaction ID (TrxID)</label>
      <input id="trxId" placeholder="TrxID লিখুন">
      <button class="btn" id="submitOrder" type="button">অর্ডার কনফার্ম করুন</button>
      <div class="summary" id="orderSummary"></div>
    </div>
  </div>

  <!-- ADMIN VIEW -->
  <div id="adminView" style="display:none;">
    <div class="stats">
      <div class="stat">মোট অর্ডার<b id="stTotal">0</b></div>
      <div class="stat">পেন্ডিং<b id="stPending">0</b></div>
      <div class="stat">আয়<b id="stRev">৳0</b></div>
    </div>

    <div class="box">
      <h2 style="margin-top:0">📋 গ্রাহকদের অর্ডারসমূহ</h2>
      <div id="orderList"></div>
    </div>

    <div class="box">
      <h2 style="margin-top:0">💰 বর্তমান প্যাকেজ তালিকা (দাম বাড়ান বা কমান)</h2>
      <div id="adminPkgList"></div>
    </div>

    <div class="box">
      <h2 style="margin-top:0">➕ নতুন প্যাকেজ যোগ করুন</h2>
      <input id="newPkgName" placeholder="প্যাকেজের নাম (যেমন: 115 Diamond)" style="margin-bottom:8px;">
      <input id="newPkgPrice" type="number" placeholder="দাম (৳)">
      <button class="btn" id="addPkgBtn" type="button">প্যাকেজ যোগ করুন</button>
    </div>

    <div class="box">
      <h2 style="margin-top:0">⚙️ পেমেন্ট নম্বর ও পাসওয়ার্ড</h2>
      <label for="setPayNum">bKash / Nagad নম্বর</label>
      <input id="setPayNum">
      <label for="setPass">নতুন Admin পাসওয়ার্ড (ডিফল্ট: mdmiraj68)</label>
      <input id="setPass" type="password" placeholder="বদলাতে চাইলে লিখুন">
      <button class="btn" id="saveCfgBtn" type="button">সেটিংস সেভ করুন</button>
    </div>
  </div>
</main>

<script>
  /** @typedef {{ n: string, p: number }} PkgItem */
  /** @typedef {{ uid: string, pkg: string, p: number, pay: string, snd: string, trx: string, st: string }} OrderItem */

  const K = { pkg: 'ff_pkgs', ord: 'ff_ords', cfg: 'ff_cfg' };

  /** @type {PkgItem[]} */
  let pkgs = JSON.parse(localStorage.getItem(K.pkg) || '[{"n":"25 Diamond","p":20},{"n":"50 Diamond","p":35},{"n":"115 Diamond","p":78},{"n":"240 Diamond","p":156},{"n":"Weekly Lite","p":40},{"n":"1X Weekly","p":155},{"n":"Monthly","p":770}]');

  /** @type {OrderItem[]} */
  let ords = JSON.parse(localStorage.getItem(K.ord) || '[]');

  let cfg = JSON.parse(localStorage.getItem(K.cfg) || '{"num":"01700-000000","pass":"admin123"}');

  /** @type {PkgItem | null} */
  let chosen = null;
  let isAdmin = false;

  /** @param {string} id */
  const el = (id) => document.getElementById(id);

  function renderStore() {
    el('payNumShow').textContent = cfg.num;
    const grid = el('pkgGrid');
    grid.innerHTML = '';
    pkgs.forEach((/** @type {PkgItem} */ item) => {
      const b = document.createElement('button');
      b.className = 'pkg';
      b.type = 'button';
      b.innerHTML = '<b>' + item.n + '</b><div class="price">৳' + item.p + '</div>';
      b.onclick = () => {
        document.querySelectorAll('.pkg').forEach((x) => x.classList.remove('selected'));
        b.classList.add('selected');
        chosen = item;
        /** @type {HTMLInputElement} */ (el('selectedPkg')).value = item.n + ' - ৳' + item.p;
      };
      grid.appendChild(b);
    });
  }

  function renderAdminPkgs() {
    const box = el('adminPkgList');
    box.innerHTML = pkgs.length ? '' : '<p style="color:#aaa;font-size:13px;">কোনো প্যাকেজ নেই।</p>';
    pkgs.forEach((/** @type {PkgItem} */ item, /** @type {number} */ idx) => {
      const row = document.createElement('div');
      row.className = 'pkg-row';
      row.innerHTML = '<div><b>' + item.n + '</b> — <span style="color:#ffbd45;font-weight:bold;">৳' + item.p + '</span></div>';

      const btns = document.createElement('div');
      const editBtn = document.createElement('button');
      editBtn.className = 'sbtn';
      editBtn.type = 'button';
      editBtn.style.background = '#3b82f6';
      editBtn.style.color = '#fff';
      editBtn.style.marginTop = '0';
      editBtn.textContent = 'দাম বদলান';
      editBtn.onclick = () => {
        const nextPrice = prompt(item.n + '-এর নতুন দাম লিখুন (৳):', String(item.p));
        if (nextPrice !== null && Number(nextPrice) > 0) {
          pkgs[idx].p = Number(nextPrice);
          saveAll();
          renderAdminPkgs();
          renderStore();
        }
      };

      const delBtn = document.createElement('button');
      delBtn.className = 'sbtn';
      delBtn.type = 'button';
      delBtn.style.background = '#ef4444';
      delBtn.style.color = '#fff';
      delBtn.style.marginTop = '0';
      delBtn.style.marginRight = '0';
      delBtn.textContent = 'মুছুন';
      delBtn.onclick = () => {
        pkgs.splice(idx, 1);
        saveAll();
        renderAdminPkgs();
        renderStore();
      };

      btns.appendChild(editBtn);
      btns.appendChild(delBtn);
      row.appendChild(btns);
      box.appendChild(row);
    });
  }

  function renderAdmin() {
    /** @type {HTMLInputElement} */ (el('setPayNum')).value = cfg.num;
    el('stTotal').textContent = String(ords.length);
    el('stPending').textContent = String(ords.filter((/** @type {OrderItem} */ o) => o.st === 'Pending').length);
    const rev = ords
      .filter((/** @type {OrderItem} */ o) => o.st === 'Completed')
      .reduce((/** @type {number} */ s, /** @type {OrderItem} */ o) => s + o.p, 0);
    el('stRev').textContent = '৳' + rev;

    renderAdminPkgs();

    const list = el('orderList');
    list.innerHTML = ords.length ? '' : '<p style="color:#aaa;font-size:13px;">এখনো কোনো অর্ডার নেই।</p>';
    ords.forEach((/** @type {OrderItem} */ o, /** @type {number} */ i) => {
      const d = document.createElement('div');
      d.className = 'ocard';
      d.innerHTML = '<b>' + o.pkg + ' (৳' + o.p + ')</b> — <span style="color:#ffbd45">' + o.st + '</span><br>UID: ' + o.uid + ' | ' + o.pay + ': ' + o.snd + ' | TrxID: <b>' + o.trx + '</b><br>';
      const ok = document.createElement('button');
      ok.className = 'sbtn';
      ok.type = 'button';
      ok.style.background = '#10b981';
      ok.textContent = '✓ Complete';
      ok.onclick = () => { ords[i].st = 'Completed'; saveAll(); renderAdmin(); };
      const del = document.createElement('button');
      del.className = 'sbtn';
      del.type = 'button';
      del.style.background = '#ef4444';
      del.style.color = '#fff';
      del.textContent = '✕ Delete';
      del.onclick = () => { ords.splice(i, 1); saveAll(); renderAdmin(); };
      d.appendChild(ok);
      d.appendChild(del);
      list.appendChild(d);
    });
  }

  function saveAll() {
    localStorage.setItem(K.pkg, JSON.stringify(pkgs));
    localStorage.setItem(K.ord, JSON.stringify(ords));
    localStorage.setItem(K.cfg, JSON.stringify(cfg));
  }

  el('submitOrder').onclick = () => {
    const uid = /** @type {HTMLInputElement} */ (el('playerId')).value.trim();
    const snd = /** @type {HTMLInputElement} */ (el('senderNum')).value.trim();
    const trx = /** @type {HTMLInputElement} */ (el('trxId')).value.trim();
    const pay = /** @type {HTMLSelectElement} */ (el('payMethod')).value;
    if (!uid || !chosen || !snd || !trx) {
      alert('সব তথ্য পূরণ করুন!');
      return;
    }
    ords.unshift({ uid, pkg: chosen.n, p: chosen.p, pay, snd, trx, st: 'Pending' });
    saveAll();
    el('orderSummary').innerHTML = '✅ অর্ডার জমা হয়েছে! UID: <b>' + uid + '</b> | TrxID: <b>' + trx + '</b>';
    el('orderSummary').style.display = 'block';
    /** @type {HTMLInputElement} */ (el('trxId')).value = '';
  };

  el('toggleAdmin').onclick = () => {
    if (!isAdmin) {
      const p = prompt('Admin পাসওয়ার্ড দিন (ডিফল্ট: admin123):');
      if (p !== cfg.pass) {
        alert('ভুল পাসওয়ার্ড!');
        return;
      }
      isAdmin = true;
      el('storeView').style.display = 'none';
      el('adminView').style.display = 'block';
      el('toggleAdmin').textContent = '← Store';
      renderAdmin();
    } else {
      isAdmin = false;
      el('adminView').style.display = 'none';
      el('storeView').style.display = 'block';
      el('toggleAdmin').textContent = '⚙️ Admin';
      renderStore();
    }
  };

  el('addPkgBtn').onclick = () => {
    const nameInput = /** @type {HTMLInputElement} */ (el('newPkgName'));
    const priceInput = /** @type {HTMLInputElement} */ (el('newPkgPrice'));
    const n = nameInput.value.trim();
    const p = Number(priceInput.value);
    if (!n || p <= 0) {
      alert('সঠিক নাম ও দাম দিন');
      return;
    }
    pkgs.push({ n, p });
    saveAll();
    nameInput.value = '';
    priceInput.value = '';
    renderAdminPkgs();
    renderStore();
    alert('নতুন প্যাকেজ যুক্ত হয়েছে!');
  };

  el('saveCfgBtn').onclick = () => {
    const numInput = /** @type {HTMLInputElement} */ (el('setPayNum'));
    const passInput = /** @type {HTMLInputElement} */ (el('setPass'));
    const num = numInput.value.trim();
    const pass = passInput.value.trim();
    if (num) cfg.num = num;
    if (pass) cfg.pass = pass;
    saveAll();
    alert('সেটিংস সেভ হয়েছে!');
  };

  renderStore();
</script>
</body>
</html>
